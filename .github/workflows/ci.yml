name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  # deploy.yml calls this before it deploys main, so main is checked once per push.
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the build output for deploy.yml to publish.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR and dev runs. Never cancel a run that gates a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install headless Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium-headless-shell
      - name: Install Chromium system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium-headless-shell
      - run: pnpm test

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # On a release PR (dev to main) this lints every commit dev adds with the release
      # config: header and type rules, looser lengths. That also covers commits pushed to
      # dev without a PR, for headers and types only.
      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONFIG: ${{ github.head_ref == 'dev' && github.base_ref == 'main' && 'commitlint.release.config.js' || 'commitlint.config.js' }}
        run: pnpm exec commitlint --config "$CONFIG" --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  fallow:
    # Fails on dead code, complexity or duplication the PR introduces. Existing findings do not gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Audit new findings
        # A release PR (dev to main) only reports. Each feature PR was gated into dev, and a
        # finding that appears only in combination has no feature branch to fix it on.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE: ${{ github.head_ref == 'dev' && github.base_ref == 'main' }}
        run: |
          if [ "$RELEASE" = true ]; then
            pnpm exec fallow review --brief --base "$BASE_SHA"
          else
            pnpm exec fallow audit --base "$BASE_SHA"
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
